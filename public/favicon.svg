<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle with portfolio color -->
  <circle cx="16" cy="16" r="15" fill="#0D1012"/>
  
  <!-- Monitor/screen icon representing web portfolio -->
  <rect x="6" y="5" width="20" height="16" rx="2" fill="#AEB9C0" stroke="#0D1012" stroke-width="1.5"/>
  
  <!-- Screen content - code brackets representing web development -->
  <g fill="#0D1012" font-size="10" font-family="monospace" font-weight="bold">
    <text x="9" y="15.5"><</text>
    <text x="22" y="15.5">></text>
  </g>
  
  <!-- Small design elements - palette dot -->
  <circle cx="25" cy="20" r="2.5" fill="#C94435"/>
  <circle cx="25" cy="20" r="1.2" fill="#AEB9C0"/>
  
  <!-- Code line indicator -->
  <rect x="7" y="16" width="18" height="1.5" rx="0.5" fill="#AEB9C0" opacity="0.4"/>
  
  <!-- Accent dots -->
  <circle cx="16" cy="26" r="1.5" fill="#C94435" opacity="0.6"/>
  <circle cx="20" cy="26" r="1" fill="#AEB9C0" opacity="0.5"/>
</svg>